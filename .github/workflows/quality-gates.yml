name: IDCC Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idcc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Route security tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run route and authorization regression tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
